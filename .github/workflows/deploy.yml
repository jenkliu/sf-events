name: Scrape & Deploy Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 13 * * *" # ~6am America/Los_Angeles (13:00 UTC)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run scraper
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: node scrape.mjs

      - name: Commit refreshed events.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- events.json; then
            git add events.json
            git commit -m "Refresh events.json"
            git push
          else
            echo "No changes to events.json"
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build site directory
        run: |
          mkdir -p _site
          cp index.html events.json _site/
          cp -r assets _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
