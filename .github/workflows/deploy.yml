name: Scrape & Deploy Pages

on:
  push:
    branches: [main, claude/youthful-brown-4ay86t]
  schedule:
    - cron: "0 13 * * *" # ~6am America/Los_Angeles (13:00 UTC)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # TEMPORARY: find the public Lower Haight Local calendar id. Remove once fixed.
      - name: Discover LHL calendar
        continue-on-error: true
        run: |
          curl -sL "https://www.lowerhaightlocal.com/events" -o /tmp/lhl.html
          echo "--- page bytes: $(wc -c < /tmp/lhl.html) ---"
          echo "--- calendar.google.com references ---"
          grep -oE 'https?://[^"'"'"' ]*calendar\.google\.com[^"'"'"' ]*' /tmp/lhl.html | sort -u | head -20
          echo "--- group.calendar.google.com ids ---"
          grep -oE '[A-Za-z0-9._%+-]+(%40|@)group\.calendar\.google\.com' /tmp/lhl.html | sort -u | head -20
          echo "--- cid= values ---"
          grep -oE 'cid=[A-Za-z0-9_=-]+' /tmp/lhl.html | sort -u | head -20
          echo "--- iframe/script srcs ---"
          grep -oE '<(iframe|script)[^>]*src="[^"]*"' /tmp/lhl.html | head -20

      - name: Run scraper
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: node scrape.mjs

      - name: Commit refreshed events.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- events.json; then
            git add events.json
            git commit -m "Refresh events.json"
            git push
          else
            echo "No changes to events.json"
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build site directory
        run: |
          mkdir -p _site
          cp index.html events.json _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
