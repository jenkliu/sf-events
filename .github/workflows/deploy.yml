name: Scrape & Deploy Pages

on:
  push:
    branches: [main, claude/youthful-brown-4ay86t]
  schedule:
    - cron: "0 13 * * *" # ~6am America/Los_Angeles (13:00 UTC)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # TEMPORARY: work out where lowerhaightlocal.com/events gets its listings. Remove once fixed.
      - name: Discover LHL events source
        continue-on-error: true
        run: |
          curl -sL "https://www.lowerhaightlocal.com/events" -o /tmp/lhl.html
          echo "=== bytes: $(wc -c < /tmp/lhl.html) ==="
          echo "=== generator / platform ==="
          grep -oiE '<meta[^>]*(generator|framer|squarespace|wix|webflow)[^>]*>' /tmp/lhl.html | head -5
          grep -oiE '(Framer|Squarespace|Webflow|Wix|__NEXT_DATA__|__remixContext|astro)' /tmp/lhl.html | sort | uniq -c | sort -rn | head -10
          echo "=== known event keywords present? ==="
          for kw in Cleanup Motown Bingo Trivia "Line Dancing" "Jazz" "Street Fair"; do
            printf '%-14s %s\n' "$kw" "$(grep -oic "$kw" /tmp/lhl.html)"
          done
          echo "=== ld+json blocks ==="
          grep -oE '<script[^>]*application/ld\+json[^>]*>.{0,600}' /tmp/lhl.html | head -3
          echo "=== all script/iframe tags (any quoting) ==="
          grep -oE '<(script|iframe)[^>]{0,200}>' /tmp/lhl.html | sort -u | head -25
          echo "=== context around first Cleanup mention ==="
          grep -oE '.{400}Cleanup.{400}' /tmp/lhl.html | head -1

      - name: Run scraper
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: node scrape.mjs

      - name: Commit refreshed events.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- events.json; then
            git add events.json
            git commit -m "Refresh events.json"
            git push
          else
            echo "No changes to events.json"
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build site directory
        run: |
          mkdir -p _site
          cp index.html events.json _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
