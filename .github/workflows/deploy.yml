name: Scrape & Deploy Pages

on:
  push:
    branches: [main, claude/youthful-brown-4ay86t]
  schedule:
    - cron: "0 13 * * *" # ~6am America/Los_Angeles (13:00 UTC)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # TEMPORARY: confirm the LHL event field names on live data. Remove next commit.
      - name: Inspect LHL event fields
        continue-on-error: true
        run: |
          node --input-type=module -e '
            const src = await import("./scrape.mjs").catch(() => null);
            const html = await (await fetch("https://www.lowerhaightlocal.com/events")).text();
            const m = [...html.matchAll(/<astro-island\b[^>]*\bprops="([^"]*)"/g)];
            const un = s => s.replace(/&quot;/g,String.fromCharCode(34)).replace(/&#39;/g,"\x27").replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&amp;/g,"&");
            const rev = n => { if(!Array.isArray(n)||n.length!==2) return n; const [t,v]=n;
              if(t===1) return Array.isArray(v)?v.map(rev):v; if(t!==0) return v;
              if(typeof v!=="object"||v===null) return v;
              if(Array.isArray(v)) return v.map(rev);
              return Object.fromEntries(Object.entries(v).map(([k,x])=>[k,rev(x)])); };
            for (const [,raw] of m) {
              const p = JSON.parse(un(raw));
              if (!p.initialGroupedEvents) continue;
              const g = rev(p.initialGroupedEvents);
              const flat = Object.values(g).flat();
              console.log("islands:", m.length, "months:", Object.keys(g).join(", "), "events:", flat.length);
              console.log("ALL KEYS:", [...new Set(flat.flatMap(e => Object.keys(e||{})))].sort().join(", "));
              console.log("SAMPLE:", JSON.stringify(flat.slice(0,2), null, 1));
              break;
            }
          '

      - name: Run scraper
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: node scrape.mjs

      - name: Commit refreshed events.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- events.json; then
            git add events.json
            git commit -m "Refresh events.json"
            git push
          else
            echo "No changes to events.json"
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build site directory
        run: |
          mkdir -p _site
          cp index.html events.json _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
