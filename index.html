<style>
  :root {
    --bg: #f4f5f8; --surface: #ffffff; --surface-2: #eef0f4;
    --ink: #191b22; --ink-soft: #565b68; --line: #e0e3ea; --line-strong: #cfd3dd;
    --accent: #3f3d9c; --warn: #b45309;
    --c-music: #2f6bd6; --c-arts: #c33a77; --c-workshop: #7c4dd6; --c-comm: #0f9488;
    --c-fit: #c47512; --c-cult: #d1503a; --c-volunteer: #3f8c3f; --c-other: #6b7280;
    --shadow: 0 1px 2px rgba(20,22,30,.05), 0 6px 20px rgba(20,22,30,.05);
    /* Height of the sticky filter header, kept up to date in JS. */
    --head-h: 0px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #131419; --surface: #1c1e26; --surface-2: #24262f;
      --ink: #f0f1f5; --ink-soft: #a2a7b4; --line: #2c2f39; --line-strong: #3a3e4a;
      --accent: #a5a3f0; --warn: #e6a84a;
      --c-music: #6ea0f2; --c-arts: #ec74a6; --c-workshop: #ad8bf0; --c-comm: #35c2b4;
      --c-fit: #e6a84a; --c-cult: #ec8168; --c-volunteer: #6fbf5c; --c-other: #9aa0ad;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.35);
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; overflow-x: hidden; background: var(--bg); color: var(--ink); font-family: "IBM Plex Sans", system-ui, -apple-system, sans-serif; line-height: 1.45; }
  .wrap { max-width: 780px; margin: 0 auto; padding-inline: 18px; padding-block: 0 56px; }

  header.site { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
  .head-inner { max-width: 780px; margin: 0 auto; padding: 18px 18px 14px; }
  .eyebrow { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--ink-soft); margin: 0 0 6px; }
  h1 { font-family: "Fraunces", Georgia, serif; font-weight: 600; font-size: clamp(26px, 6vw, 38px); line-height: 1.02; margin: 0; display: flex; align-items: center; gap: 10px; }
  h1 .site-icon { width: clamp(26px, 6vw, 38px); height: clamp(26px, 6vw, 38px); border-radius: 50%; flex: none; }
  .sub { color: var(--ink-soft); font-size: 13.5px; margin: 8px 0 0; max-width: 64ch; }

  .filters { margin-top: 16px; display: flex; flex-direction: column; gap: 12px; }
  .filter-label { font-family: "IBM Plex Mono", monospace; font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-soft); margin-bottom: 7px; }
  .chips { display: flex; flex-wrap: wrap; gap: 7px; }
  .chip { display: inline-flex; align-items: center; gap: 7px; font: inherit; font-size: 12.5px; font-weight: 500; padding: 6px 11px; border-radius: 999px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); cursor: pointer; transition: transform .08s ease, background .12s ease, border-color .12s ease; -webkit-tap-highlight-color: transparent; }
  .chip:hover { border-color: var(--cat, var(--accent)); }
  .chip:active { transform: translateY(1px); }
  .chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .chip .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--cat, var(--ink-soft)); flex: none; }
  .chip .n { font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .chip[aria-pressed="true"] { background: var(--cat, var(--accent)); border-color: var(--cat, var(--accent)); color: #fff; }
  .chip[aria-pressed="true"] .dot { background: rgba(255,255,255,.9); }
  .chip[aria-pressed="true"] .n { color: rgba(255,255,255,.85); }

  .daypills { display: flex; align-items: flex-start; gap: 8px; overflow-x: auto; padding: 2px 0 6px; margin-bottom: 4px; -webkit-overflow-scrolling: touch; }
  .daypill { flex: 0 0 auto; width: 52px; max-width: 52px; padding: 9px 0 7px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); border-radius: 16px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 3px; transition: transform .08s ease, background .12s ease, border-color .12s ease; -webkit-tap-highlight-color: transparent; }
  .daypill:hover { border-color: var(--accent); }
  .daypill:active { transform: translateY(1px); }
  .daypill:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .daypill .pd-dow { font-family: "IBM Plex Mono", monospace; font-size: 10px; line-height: 1; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); }
  .daypill .pd-num { font-family: "Fraunces", Georgia, serif; font-size: 21px; font-weight: 600; line-height: 1; }
  .daypill .pd-cnt { font-family: "IBM Plex Mono", monospace; font-size: 9.5px; line-height: 1; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .daypill[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .daypill[aria-pressed="true"] .pd-dow, .daypill[aria-pressed="true"] .pd-cnt { color: rgba(255,255,255,.85); }
  .daypill.no-events { opacity: .4; cursor: default; }
  .daypill.no-events:hover { border-color: var(--line-strong); }
  .daypill.is-today:not([aria-pressed="true"]) { border-color: var(--accent); }
  .daypill.is-today:not([aria-pressed="true"]) .pd-dow { color: var(--accent); }

  .date-row { display: flex; align-items: flex-start; gap: 8px; }
  .date-row .daypills { flex: 0 1 auto; }
  .pickdate-wrap { position: relative; flex: 0 0 auto; display: flex; align-self: stretch; margin: 2px 0 6px; }
  .pickdate { width: 52px; padding: 8px 0; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); border-radius: 16px; cursor: pointer; font: inherit; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; transition: transform .08s ease, background .12s ease, border-color .12s ease; -webkit-tap-highlight-color: transparent; }
  .pickdate:hover { border-color: var(--accent); }
  .pickdate:active { transform: translateY(1px); }
  .pickdate:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .pickdate svg { width: 19px; height: 19px; flex: none; }
  .pickdate .pk-clear, .pickdate[aria-pressed="true"] .pk-cal { display: none; }
  .pickdate[aria-pressed="true"] .pk-clear { display: block; }
  .pickdate .pk-txt { font-family: "IBM Plex Mono", monospace; font-size: 9.5px; line-height: 1; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-soft); white-space: nowrap; }
  .pickdate[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .pickdate[aria-pressed="true"] .pk-txt { color: rgba(255,255,255,.85); }
  /* The real input sits under the button, invisible: it only exists to open
     the platform date picker, which anchors to it. */
  .pickdate-input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; pointer-events: none; border: 0; padding: 0; }

  .more-filters { display: flex; flex-direction: column; gap: 12px; }
  .more-toggle { display: inline-flex; align-items: center; gap: 7px; font: inherit; font-size: 12.5px; font-weight: 500; align-self: flex-start; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .more-toggle:active { transform: translateY(1px); }
  .more-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .more-toggle .mf-count { font-family: "IBM Plex Mono", monospace; font-size: 10.5px; font-weight: 600; line-height: 1; color: #fff; background: var(--accent); border-radius: 999px; padding: 3px 6px; font-variant-numeric: tabular-nums; }
  .more-toggle .mf-count[hidden] { display: none; }
  .more-toggle .mf-chev { width: 15px; height: 15px; color: var(--ink-soft); transition: transform .18s ease; }
  .more-toggle[aria-expanded="true"] .mf-chev { transform: rotate(180deg); }
  @media (prefers-reduced-motion: reduce) { .more-toggle .mf-chev { transition: none; } }

  .filters:not(.more-open) .more-filters { display: none; }

  @media (max-width: 640px) {
    .daypills { overflow-x: visible; gap: 5px; }
    .daypill { flex: 1 1 0; width: auto; max-width: 60px; min-width: 0; padding: 8px 2px 6px; }
    .daypill .pd-dow { font-size: 9px; }
    .daypill .pd-num { font-size: 18px; }
    .daypill .pd-cnt { font-size: 8.5px; }
    .date-row { gap: 5px; }
    .date-row .daypills { flex: 1 1 auto; min-width: 0; }
    .pickdate { width: 42px; }
    .pickdate svg { width: 17px; height: 17px; }
    .pickdate .pk-txt { font-size: 8.5px; }
    /* Keep the header short enough that the list is visible: category folds
       into "More filters" alongside source. */
    .filters:not(.more-open) .cat-group { display: none; }
  }

  .toolbar { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin: 20px 0 6px; }
  .count { font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .reset { font: inherit; font-size: 12px; background: none; border: 0; color: var(--accent); cursor: pointer; padding: 0; }
  .reset[hidden] { display: none !important; }

  .month { font-family: "IBM Plex Mono", monospace; font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-soft); margin: 30px 0 0; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
  #list > .month:first-child { margin-top: 10px; }

  .day { position: sticky; top: var(--head-h); z-index: 5; background: var(--bg); display: flex; align-items: baseline; gap: 9px; margin: 20px 0 0; padding: 7px 0 5px; border-bottom: 1px solid var(--line); }
  .month + .day { margin-top: 14px; }
  .day-name { font-family: "Fraunces", Georgia, serif; font-size: 16.5px; font-weight: 600; line-height: 1.1; }
  .day-tag { font-family: "IBM Plex Mono", monospace; font-size: 9.5px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: #fff; background: var(--accent); border-radius: 999px; padding: 2px 7px; }
  .day-tag.soft { background: none; color: var(--ink-soft); border: 1px solid var(--line-strong); }
  .day-cnt { margin-left: auto; font-family: "IBM Plex Mono", monospace; font-size: 10.5px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }

  .event { border-bottom: 1px solid var(--line); }
  .ev-head { display: grid; grid-template-columns: 58px 1fr 18px; gap: 14px; align-items: start; width: 100%; text-align: left; background: none; border: 0; color: inherit; font: inherit; cursor: pointer; padding: 14px 2px; -webkit-tap-highlight-color: transparent; }
  .ev-head:hover { background: color-mix(in srgb, var(--accent) 5%, transparent); }
  .ev-head:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; border-radius: 8px; }
  .when { display: block; text-align: right; padding-top: 3px; font-family: "IBM Plex Mono", monospace; font-size: 11.5px; color: var(--ink); font-weight: 500; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .ev-body { min-width: 0; }
  .ev-title { font-size: 15.5px; font-weight: 600; margin: 0 0 3px; line-height: 1.25; display: block; }
  .ev-meta { font-size: 12.5px; color: var(--ink-soft); display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
  .ev-meta .venue { font-weight: 500; color: var(--ink); }
  .price-free { color: var(--c-comm); font-weight: 600; }
  .dupbadge { display: inline-flex; align-items: center; gap: 4px; font-size: 10.5px; font-weight: 600; color: var(--warn); border: 1px solid color-mix(in srgb, var(--warn) 40%, transparent); background: color-mix(in srgb, var(--warn) 12%, var(--surface)); padding: 1px 7px; border-radius: 999px; }
  .cats { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .tag { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 500; padding: 3px 8px; border-radius: 6px; background: color-mix(in srgb, var(--cat) 13%, var(--surface)); color: var(--cat); border: 1px solid color-mix(in srgb, var(--cat) 28%, transparent); }
  .tag .tdot { width: 6px; height: 6px; border-radius: 50%; background: var(--cat); }

  .chev { width: 18px; height: 18px; color: var(--ink-soft); margin-top: 4px; transition: transform .18s ease; flex: none; }
  .ev-head[aria-expanded="true"] .chev { transform: rotate(180deg); }

  .detail { margin-left: 68px; padding: 2px 2px 16px; animation: fade .18s ease; }
  .detail[hidden] { display: none !important; }
  @keyframes fade { from { opacity: 0; transform: translateY(-3px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .detail { animation: none; } .chev { transition: none; } }
  .detail .detmeta { margin: 0 0 10px; font-family: "IBM Plex Mono", monospace; font-size: 11.5px; color: var(--ink-soft); }
  .detail p { margin: 0 0 12px; font-size: 13.5px; color: var(--ink); max-width: 62ch; overflow-wrap: break-word; }
  .detail .noinfo { color: var(--ink-soft); font-style: italic; }
  .detail .dupline { color: var(--warn); font-size: 12.5px; margin: -4px 0 12px; }
  .detail a.evlink { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; text-decoration: none; color: var(--accent); border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent); padding: 6px 12px; border-radius: 999px; background: color-mix(in srgb, var(--accent) 8%, var(--surface)); }
  .detail a.evlink:hover { background: color-mix(in srgb, var(--accent) 15%, var(--surface)); }
  .evrow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .evsrc { font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--ink-soft); opacity: .75; }

  /* Narrow screens: the left column only carries a time now, so give the
     width back to the title. Must come after the rules it overrides. */
  @media (max-width: 640px) {
    .ev-head { grid-template-columns: 46px 1fr 16px; gap: 10px; }
    .when { font-size: 11px; }
    .detail { margin-left: 56px; }
    .day-name { font-size: 15.5px; }
  }
  .detail a.evlink:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .empty, .loading, .error { text-align: center; color: var(--ink-soft); padding: 48px 16px; font-size: 14px; }
  .empty[hidden], .loading[hidden], .error[hidden] { display: none !important; }
  .error { color: var(--warn); }

  footer { margin-top: 32px; padding-top: 16px; border-top: 1px solid var(--line); font-size: 12px; color: var(--ink-soft); }
  footer code { font-family: "IBM Plex Mono", monospace; background: var(--surface-2); padding: 1px 5px; border-radius: 4px; }
</style>
</head>
<body>

<header class="site">
  <div class="head-inner">
    <h1><img class="site-icon" src="./assets/favicon.png" alt="" width="38" height="38">what's good sf?</h1>
    <p class="sub">a rundown of arts &amp; community events in san francisco</p>
    <div class="filters" id="filters">
      <div>
        <div class="filter-label">Pick a day</div>
        <div class="date-row">
          <div class="daypills" id="dayPills"></div>
          <span class="pickdate-wrap">
            <button class="pickdate" id="pickDate" type="button" aria-pressed="false" aria-label="Pick a date">
              <svg class="pk-cal" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="16" rx="2.5"></rect><path d="M3 9.5h18M8 2.5v4M16 2.5v4"></path></svg>
              <svg class="pk-clear" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
              <span class="pk-txt" id="pickDateTxt">Pick</span>
            </button>
            <input class="pickdate-input" type="date" id="pickDateInput" tabindex="-1" aria-hidden="true">
          </span>
        </div>
      </div>
      <div class="cat-group">
        <div class="filter-label">Pick a category (or multiple)</div>
        <div class="chips" id="catChips"></div>
      </div>
      <button class="more-toggle" id="moreToggle" type="button" aria-expanded="false" aria-controls="moreFilters">
        <span class="mf-label">More filters</span>
        <span class="mf-count" id="moreCount" hidden></span>
        <svg class="mf-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"></polyline></svg>
      </button>
      <div class="more-filters" id="moreFilters">
        <div>
          <div class="filter-label">Source</div>
          <div class="chips" id="srcChips"></div>
        </div>
      </div>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="toolbar">
    <span class="count" id="count"></span>
    <button class="reset" id="reset" hidden>Clear filters</button>
  </div>
  <div class="loading" id="loading">Loading events&hellip;</div>
  <div class="error" id="error" hidden></div>
  <div id="list"></div>
  <div class="empty" id="empty" hidden>No events match those filters.</div>
  <footer id="footer" hidden>Data refreshed via <code>scrape.mjs</code>. Source: <a id="jsonLink" href="./events.json">events.json</a>.</footer>
</div>

<script>
  const CATS = {
    "Music":                { var: "--c-music" },
    "Arts & Performance":   { var: "--c-arts" },
    "Fitness & Wellness":   { var: "--c-fit" },
    "Volunteering & Civic": { var: "--c-volunteer" },
    "Festivals & Markets":  { var: "--c-cult" },
    "Talks & Workshops":    { var: "--c-workshop" },
    "Community & Social":   { var: "--c-comm" },
    "Other":                { var: "--c-other" },
  };

  const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  const DOW_SHORT = DOW;

  const pad = n => String(n).padStart(2, "0");
  const ymd = dt => `${dt.getFullYear()}-${pad(dt.getMonth()+1)}-${pad(dt.getDate())}`;
  const addDays = (dt, n) => { const x = new Date(dt); x.setDate(x.getDate()+n); return x; };
  function fmtStart(st) {
    if (st == null || st < 0 || st >= 9999) return "TBA";
    const h = Math.floor(st / 60), mn = st % 60;
    const mer = h >= 12 ? "PM" : "AM";
    let h12 = h % 12; if (h12 === 0) h12 = 12;
    return mn ? `${h12}:${String(mn).padStart(2,"0")} ${mer}` : `${h12} ${mer}`;
  }
  function esc(s) { return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
  function catVar(name) { return CATS[name] ? `var(${CATS[name].var})` : `var(--c-other)`; }

  const state = { cats: new Set(), src: null, dateRange: null, open: new Set() };

  const TODAY = new Date(); TODAY.setHours(0,0,0,0);
  const TODAY_ISO = ymd(TODAY);
  const TOMORROW_ISO = ymd(addDays(TODAY, 1));
  const DAY_PILLS = 7;

  let EVENTS = [];
  let SRC_LIST = [];

  const filtersEl = document.getElementById("filters");
  const pickBtnEl = document.getElementById("pickDate");
  const pickInputEl = document.getElementById("pickDateInput");
  const pickTxtEl = document.getElementById("pickDateTxt");
  const moreToggleEl = document.getElementById("moreToggle");
  const moreCountEl = document.getElementById("moreCount");

  moreToggleEl.addEventListener("click", () => {
    const open = !filtersEl.classList.contains("more-open");
    filtersEl.classList.toggle("more-open", open);
    moreToggleEl.setAttribute("aria-expanded", open);
    moreToggleEl.querySelector(".mf-label").textContent = open ? "Fewer filters" : "More filters";
  });

  // Below 640px the category chips fold into the collapsible section too, so
  // what the closed toggle has to account for depends on the viewport.
  const NARROW = window.matchMedia("(max-width: 640px)");
  function syncMoreCount() {
    const n = (NARROW.matches ? state.cats.size : 0) + (state.src ? 1 : 0);
    moreCountEl.textContent = n;
    moreCountEl.hidden = n === 0;
  }
  NARROW.addEventListener("change", syncMoreCount);

  // Day headers stick directly below the filter header, whose height changes
  // with the viewport and with the disclosure opening.
  const headerEl = document.querySelector("header.site");
  function syncHeaderHeight() {
    document.documentElement.style.setProperty("--head-h", headerEl.offsetHeight + "px");
  }
  if (typeof ResizeObserver === "function") {
    new ResizeObserver(syncHeaderHeight).observe(headerEl);
  } else {
    window.addEventListener("resize", syncHeaderHeight);
  }
  syncHeaderHeight();

  // A picked date is shown on its day pill when it falls inside the strip, and
  // on the pick-date button itself when it doesn't.
  function syncDateUI() {
    const k = state.dateRange ? state.dateRange.key : null;
    let onStrip = false;
    document.querySelectorAll("#dayPills .daypill").forEach(x => {
      const on = !!(k && x.dataset.key === k);
      if (on) onStrip = true;
      x.setAttribute("aria-pressed", on);
    });
    const offStrip = !!k && !onStrip;
    pickBtnEl.setAttribute("aria-pressed", offStrip);
    pickTxtEl.textContent = offStrip ? shortDate(state.dateRange.min) : "Pick";
    pickBtnEl.setAttribute("aria-label", offStrip
      ? `Showing ${longDate(state.dateRange.min)} — clear this date`
      : "Pick a date");
    // Keep the native picker in step, so reopening it shows the current day.
    pickInputEl.value = k ? state.dateRange.min : "";
  }
  function shortDate(iso) {
    const [, m, d] = iso.split("-").map(Number);
    return `${MONTHS[m-1]} ${d}`;
  }
  function longDate(iso) {
    const [y, m, d] = iso.split("-").map(Number);
    return `${DOW[new Date(y, m-1, d).getDay()]}, ${MONTHS[m-1]} ${d}`;
  }
  function selectDay(iso, { toggle = true } = {}) {
    const key = "day-" + iso;
    const same = state.dateRange && state.dateRange.key === key;
    state.dateRange = (same && toggle) ? null : { key, min: iso, max: iso };
    syncDateUI();
    render();
  }

  pickBtnEl.addEventListener("click", () => {
    if (pickBtnEl.getAttribute("aria-pressed") === "true") {
      state.dateRange = null;
      syncDateUI();
      render();
      return;
    }
    if (typeof pickInputEl.showPicker === "function") {
      try { pickInputEl.showPicker(); return; } catch (_) { /* fall through */ }
    }
    pickInputEl.focus();
    pickInputEl.click();
  });
  // Picking the day that is already selected shouldn't clear it — only a second
  // click on a day pill does that.
  pickInputEl.addEventListener("change", () => {
    if (pickInputEl.value) selectDay(pickInputEl.value, { toggle: false });
  });

  function match(e) {
    if (state.dateRange && (e.date < state.dateRange.min || e.date > state.dateRange.max)) return false;
    if (state.src && e.source !== state.src) return false;
    if (state.cats.size && !e.categories.some(c => state.cats.has(c))) return false;
    return true;
  }

  const CHEV = '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"></polyline></svg>';
  const LINKICON = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7"></path><path d="M8 7h9v9"></path></svg>';

  const listEl = document.getElementById("list");
  const emptyEl = document.getElementById("empty");
  const countEl = document.getElementById("count");
  const resetEl = document.getElementById("reset");

  function render() {
    const shown = EVENTS.filter(match);
    listEl.innerHTML = "";
    const perDay = {};
    shown.forEach(e => perDay[e.date] = (perDay[e.date] || 0) + 1);
    let curMonth = "", curDay = "";
    shown.forEach(e => {
      const [y, m, d] = e.date.split("-").map(Number);
      const mLabel = `${MONTHS[m-1]} ${y}`;
      if (mLabel !== curMonth) {
        curMonth = mLabel;
        const h = document.createElement("div");
        h.className = "month";
        h.textContent = mLabel;
        listEl.appendChild(h);
      }
      const dow = DOW[new Date(y, m-1, d).getDay()];
      if (e.date !== curDay) {
        curDay = e.date;
        const n = perDay[e.date];
        const tag = e.date === TODAY_ISO ? `<span class="day-tag">Today</span>`
                  : e.date === TOMORROW_ISO ? `<span class="day-tag soft">Tomorrow</span>` : "";
        const h = document.createElement("div");
        h.className = "day";
        h.innerHTML = `<span class="day-name">${dow} ${d}</span>${tag}<span class="day-cnt">${n} event${n === 1 ? "" : "s"}</span>`;
        listEl.appendChild(h);
      }
      const isOpen = state.open.has(e._id);
      const tags = e.categories.map(c =>
        `<span class="tag" style="--cat:${catVar(c)}"><span class="tdot"></span>${esc(c)}</span>`
      ).join("");
      const price = e.free === true ? `<span class="price-free">Free</span>`
                  : e.free === false ? `<span>Tickets</span>`
                  : "";
      const isDup = e.alsoIn && e.alsoIn.length > 1;
      const dupBadge = isDup ? `<span class="dupbadge">&#9888; Also in ${esc(e.alsoIn.length - 1)} other source${e.alsoIn.length > 2 ? "s" : ""}</span>` : "";
      const dupLine = isDup ? `<p class="dupline">Also listed by: ${esc(e.alsoIn.filter(s => s !== e.source).join(", "))}</p>` : "";
      const body = e.description
        ? `<p>${esc(e.description)}</p>`
        : `<p class="noinfo">No description available from this source &mdash; see the event page for details.</p>`;
      // Most sources' timeLabel is just the start time reformatted — already
      // shown in the collapsed header — so only surface it when it actually
      // says more (a real range, "All day", "Time TBA").
      const timeDetail = e.timeLabel && e.timeLabel !== fmtStart(e.startMinutes)
        ? `<p class="detmeta">${esc(e.timeLabel)}</p>` : "";

      const wrap = document.createElement("div");
      wrap.className = "event";
      wrap.innerHTML = `
        <button class="ev-head" aria-expanded="${isOpen}" aria-controls="${e._id}-d">
          <span class="when">${esc(fmtStart(e.startMinutes))}</span>
          <span class="ev-body">
            <span class="ev-title">${esc(e.title)}</span>
            <span class="ev-meta">
              <span class="venue">${esc(e.venue || e.source)}</span>
              ${price}
              ${dupBadge}
            </span>
            <span class="cats">${tags}</span>
          </span>
          ${CHEV}
        </button>
        <div class="detail" id="${e._id}-d" ${isOpen ? "" : "hidden"}>
          ${timeDetail}
          ${body}
          ${dupLine}
          <div class="evrow">
            ${e.url ? `<a class="evlink" href="${esc(e.url)}" target="_blank" rel="noopener noreferrer">Event page ${LINKICON}</a>` : ""}
            <span class="evsrc">Source: ${esc(e.source)}</span>
          </div>
        </div>`;

      const head = wrap.querySelector(".ev-head");
      const detail = wrap.querySelector(".detail");
      head.addEventListener("click", () => {
        const nowOpen = !state.open.has(e._id);
        nowOpen ? state.open.add(e._id) : state.open.delete(e._id);
        head.setAttribute("aria-expanded", nowOpen);
        detail.hidden = !nowOpen;
      });
      listEl.appendChild(wrap);
    });
    emptyEl.hidden = shown.length !== 0 || EVENTS.length === 0;
    const active = state.cats.size || state.src || state.dateRange;
    countEl.textContent = `${shown.length} of ${EVENTS.length} events`;
    resetEl.hidden = !active;
    syncMoreCount();
  }

  function buildFilters() {
    const dayWrap = document.getElementById("dayPills");
    dayWrap.innerHTML = "";
    for (let i = 0; i < DAY_PILLS; i++) {
      const dt = addDays(TODAY, i);
      const iso = ymd(dt);
      const key = "day-" + iso;
      const cnt = EVENTS.filter(e => e.date === iso).length;
      const b = document.createElement("button");
      b.className = "daypill" + (cnt ? "" : " no-events") + (iso === TODAY_ISO ? " is-today" : "");
      b.dataset.key = key;
      b.setAttribute("aria-pressed", "false");
      b.setAttribute("aria-label", `${DOW_SHORT[dt.getDay()]} ${dt.getDate()}${iso===TODAY_ISO?" (today)":""} — ${cnt} event${cnt===1?"":"s"}`);
      b.innerHTML = `<span class="pd-dow">${DOW_SHORT[dt.getDay()]}</span><span class="pd-num">${dt.getDate()}</span><span class="pd-cnt">${cnt || "&middot;"}</span>`;
      if (cnt) b.addEventListener("click", () => selectDay(iso));
      dayWrap.appendChild(b);
    }

    // Keep the picker inside the window we actually hold events for.
    pickInputEl.min = TODAY_ISO;
    pickInputEl.max = EVENTS.length ? EVENTS[EVENTS.length - 1].date : TODAY_ISO;

    const chipWrap = document.getElementById("catChips");
    chipWrap.innerHTML = "";
    const counts = {};
    EVENTS.forEach(e => e.categories.forEach(c => counts[c] = (counts[c] || 0) + 1));
    Object.keys(counts).sort((a,b) => counts[b]-counts[a]).forEach(name => {
      const b = document.createElement("button");
      b.className = "chip";
      b.setAttribute("aria-pressed", "false");
      b.style.setProperty("--cat", catVar(name));
      b.innerHTML = `<span class="dot"></span><span>${esc(name)}</span><span class="n">${counts[name]}</span>`;
      b.addEventListener("click", () => {
        state.cats.has(name) ? state.cats.delete(name) : state.cats.add(name);
        b.setAttribute("aria-pressed", state.cats.has(name));
        render();
      });
      chipWrap.appendChild(b);
    });

    const srcWrap = document.getElementById("srcChips");
    srcWrap.innerHTML = "";
    const srcCounts = {};
    EVENTS.forEach(e => srcCounts[e.source] = (srcCounts[e.source] || 0) + 1);
    SRC_LIST = Object.keys(srcCounts).sort();
    SRC_LIST.forEach(k => {
      const b = document.createElement("button");
      b.className = "chip";
      b.dataset.src = k;
      b.setAttribute("aria-pressed", "false");
      b.innerHTML = `<span>${esc(k)}</span><span class="n">${srcCounts[k]}</span>`;
      b.addEventListener("click", () => {
        state.src = (state.src === k) ? null : k;
        document.querySelectorAll("#srcChips .chip").forEach(x => x.setAttribute("aria-pressed", x.dataset.src === state.src));
        render();
      });
      srcWrap.appendChild(b);
    });

    document.getElementById("reset").addEventListener("click", () => {
      state.cats.clear(); state.src = null; state.dateRange = null;
      document.querySelectorAll("#catChips .chip").forEach(c => c.setAttribute("aria-pressed", "false"));
      document.querySelectorAll("#srcChips .chip").forEach(c => c.setAttribute("aria-pressed", "false"));
      syncDateUI();
      render();
    });

    syncDateUI();
  }

  async function init() {
    const loadingEl = document.getElementById("loading");
    const errorEl = document.getElementById("error");
    try {
      const res = await fetch("./events.json", { cache: "no-store" });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      EVENTS = data
        .filter(e => e.date >= TODAY_ISO)
        .map((e, i) => ({ ...e, categories: e.categories && e.categories.length ? e.categories : ["Other"], _id: "ev" + i }));

      loadingEl.hidden = true;
      document.getElementById("footer").hidden = false;
      buildFilters();
      render();
    } catch (err) {
      loadingEl.hidden = true;
      errorEl.hidden = false;
      errorEl.textContent = `Couldn't load events.json (${err.message}). The scraper may not have run yet.`;
    }
  }

  init();
</script>

</body>
</html>
